name: Collect

# Mirrors new plugin release zips into this repository's releases and republishes the catalog.
# A plugin's release workflow starts a run; the schedule picks up releases whose start was skipped
# or failed.
on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]

# A release that arrives during a run queues one more run instead of cancelling this one.
concurrency:
  group: collect
  cancel-in-progress: false

permissions: {}

env:
  CATALOG_URL: https://netalondon-jellyfin-plugins.github.io/plugin-repository/manifest.json

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # this repository's releases
    outputs:
      changed: ${{ steps.collect.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - id: collect
        name: Mirror new zips and build the catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLUGIN_READ_TOKEN: ${{ secrets.PLUGIN_READ_TOKEN }}
        run: python3 scripts/collect.py --output public/manifest.json --live-catalog "$CATALOG_URL"
      # A version that failed to mirror is left out and fails the step, but the rest still deploys.
      - if: ${{ !cancelled() && steps.collect.outputs.changed == 'true' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: collect
    if: ${{ !cancelled() && needs.collect.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}manifest.json
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
